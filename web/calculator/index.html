<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S1VP1P3SH7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-S1VP1P3SH7');
  </script>
  <meta charset="utf-8">
  <title>Symbolic Calculator — Dart Data</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="index.dart.js"></script>
</head>
<body class="calc-body">
  <header class="app-header calc-header">
    <div class="header-left">
      <details class="app-switcher">
        <summary>
          <span class="app-switcher-brand">
            <span>🧮</span>
            <span class="app-switcher-title">Calculator</span>
          </span>
          <span class="app-switcher-caret">▾</span>
        </summary>
        <nav class="app-switcher-menu" aria-label="Switch Application">
          <a href="../" class="app-switcher-item">
            <span class="app-switcher-item-icon">📦</span>
            <span class="app-switcher-item-text">
              <span class="app-switcher-item-name">Dart Data Home</span>
              <span class="app-switcher-item-desc">Overview &amp; subsystems</span>
            </span>
          </a>
          <div class="app-switcher-divider"></div>
          <a href="../distributions/" class="app-switcher-item">
            <span class="app-switcher-item-icon">📊</span>
            <span class="app-switcher-item-text">
              <span class="app-switcher-item-name">Distributions</span>
              <span class="app-switcher-item-desc">Probability &amp; statistics</span>
            </span>
          </a>
          <a href="../expressions/" class="app-switcher-item">
            <span class="app-switcher-item-icon">⚡</span>
            <span class="app-switcher-item-text">
              <span class="app-switcher-item-name">Expressions</span>
              <span class="app-switcher-item-desc">Symbolic algebra &amp; calculus</span>
            </span>
          </a>
          <a href="../calculator/" class="app-switcher-item active">
            <span class="app-switcher-item-icon">🧮</span>
            <span class="app-switcher-item-text">
              <span class="app-switcher-item-name">Calculator</span>
              <span class="app-switcher-item-desc">Notebook &amp; RPN workbench</span>
            </span>
          </a>
        </nav>
      </details>
    </div>

    <div class="calc-header-center">
      <div class="calc-mode-segmented" role="tablist" aria-label="Calculator Mode">
        <button id="mode-scroll-btn" type="button" class="calc-mode-btn active" title="Notebook Scroll Mode (Ctrl/Cmd+M)">Scroll</button>
        <button id="mode-rpn-btn" type="button" class="calc-mode-btn" title="Reverse Polish Notation Stack Mode (Ctrl/Cmd+M)">RPN</button>
      </div>
    </div>

    <div class="calc-header-right">
      <button id="btn-undo" type="button" class="calc-header-btn calc-header-icon-btn" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 14 4 9l5-5"/>
          <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>
        </svg>
      </button>
      <button id="btn-redo" type="button" class="calc-header-btn calc-header-icon-btn" title="Redo (Ctrl+Y / Cmd+Shift+Z)" aria-label="Redo" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 14 5-5-5-5"/>
          <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/>
        </svg>
      </button>
      <div class="calc-popover-anchor">
        <button id="pill-vars" type="button" class="calc-header-btn" title="Assigned Variables &amp; Functions">Vars (0)</button>
        <div id="vars-drawer" class="calc-popover hidden"></div>
      </div>
      <button id="btn-palette" type="button" class="calc-header-btn" title="Command Palette (Ctrl/Cmd+K)">⌘K</button>
      <div class="calc-popover-anchor">
        <button id="btn-settings" type="button" class="calc-header-btn calc-header-icon-btn" title="Calculator Settings &amp; Export" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <div id="settings-popover" class="calc-popover calc-settings-popover hidden"></div>
      </div>
      <button id="btn-help" type="button" class="calc-header-btn calc-header-icon-btn" title="Syntax &amp; Command Reference (Ctrl/Cmd+/)" aria-label="Help">?</button>
    </div>
  </header>

  <main id="calc-workspace" class="calc-workspace"></main>

  <div id="calc-toast" class="calc-toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
