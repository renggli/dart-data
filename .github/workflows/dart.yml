name: Dart CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read

jobs:
  build:
    name: "Dart CI"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v6
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;dart:stable"
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: "Dependencies"
        run: dart pub upgrade --no-precompile
      - name: "Dart Analyzer"
        run: dart analyze --fatal-infos .
      - name: "Dart Formatter"
        run: dart format --output=none --set-exit-if-changed .
      - name: "VM Tests"
        run: dart test --platform vm
      - name: "Chrome Tests"
        run: |
          trap 'rm -f test/.chrome_bundle_test.dart' EXIT
          python3 -c '
          import pathlib, re
          tests = sorted(pathlib.Path("test").rglob("*_test.dart"))
          included = [
              p.relative_to("test").as_posix()
              for p in tests
              if not re.search(r"@TestOn\s*\(\s*[\x27\"]vm[\x27\"]\s*\)", p.read_text())
          ]
          lines = ["import \x27package:test/scaffolding.dart\x27;"]
          lines += [f"import \x27{rel}\x27 as t{i};" for i, rel in enumerate(included)]
          lines.append("void main() {")
          lines += [f"  group(\x27{rel}\x27, t{i}.main);" for i, rel in enumerate(included)]
          lines.append("}")
          pathlib.Path("test/.chrome_bundle_test.dart").write_text("\n".join(lines) + "\n")
          '
          dart test --platform chrome test/.chrome_bundle_test.dart
      - name: "Collect coverage"
        run: |
          dart pub global activate coverage
          dart pub global run coverage:test_with_coverage
      - name: "Upload coverage"
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  check:
    name: "Flutter CI"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: amake/dart-flutter-compat@v1
        with:
          channel: stable
          cache: true